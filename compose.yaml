services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - task_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasks}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  task_db:
